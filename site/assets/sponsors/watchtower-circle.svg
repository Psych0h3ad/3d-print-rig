    <path fill="#ffffff" d="M4 24v-11h2v-2H4v-2h2V7H4V5h2V3H4V1h4v2h2V1h4v2h2V1h4v2h-2v2h2v2h-2v2h2v2h-2v2h2v11h-6v-5h-4v5H4zm2-2h2v-5h8v5h2V3h-2v2h-2V3h-4v2H8V3H6v19zM10 15h4v-2h-4v2zm0-4h4v-2h-4v2z"/>
