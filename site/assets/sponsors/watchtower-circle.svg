<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="28" height="28" role="img" aria-label="Watchtower">
  <!-- Round brand-indigo tile. Round rather than square because every surface
       that shows a favicon at a glance (Google Search results, most PWA and
       share targets) masks it into a circle anyway, and a circle reads as
       intentional there instead of a square floating inside a ring. -->
  <circle cx="14" cy="14" r="14" fill="#312e81"/>
