<!doctype html>
<html lang="ja">
<head>
<script src="./display-start.js?v=workspace-belts-2">
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Toolchangers · 3D Print Rig</title>
<link rel="stylesheet" href="./viewer.css?v=workspace-belts-1">
<link rel="stylesheet" href="./toolheads.css">
<link rel="stylesheet" href="./toolchangers.css?v=workspace-belts-1">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"},"scopes":{"./vendor-r180/":{"three":"./vendor-r180/three.module.js"}}}</script>
<link rel="stylesheet" href="./workspace.css?v=8556101583ef781e96c1">
</head>
<body class="toolhead-viewer">
<header>
<div class="brand">
<span class="brand-mark">PR</span>
<div>
<strong>3D Print Rig</strong>
<small>TOOLCHANGER WORKBENCH</small>
</div>
</div>
<div class="header-actions">
<a class="mode-link" href="./">プリンター</a>
<a class="mode-link" href="./toolheads.html">ヘッド</a>
<a class="mode-link" href="./gantries.html">ガントリー</a>
<button id="openSources">出典・ライセンス</button>
<button id="openRender" disabled>画像を書き出す</button>
<button id="openDownloads" hidden>
</button>
</div>
</header>
<main class="workspace">
<aside>
<span class="eyebrow">STEALTHCHANGER · TAPCHANGER · MADMAX · YUDX</span>
<h1>交換機構を見る</h1>
<p class="foot">シャトル、バックプレート、専用押出機とドックを原本CADで比較します。</p>
<label for="system">交換機構</label>
<select id="system" disabled>
</select>
<label for="interface">ベルト・取付</label>
<select id="interface" disabled>
</select>
<label for="toolhead">ヘッド側</label>
<select id="toolhead" disabled>
</select>
<p class="status" id="changerStatus" aria-live="polite">CADを準備中…</p>
<dl id="changerSpec" class="probe-metrics">
</dl>
<details open>
<summary>検証・組立条件</summary>
<ul class="foot" id="changerNotes">
</ul>
</details>
<details open>
<summary>機構を見る</summary>
<label for="probeTravel">Zプローブの変位 <output id="probeValue">0 mm</output>
</label>
<input id="probeTravel" type="range" min="0" max="3" step="0.1" value="0" disabled>
<label for="explode">交換部の分解表示</label>
<input id="explode" type="range" min="0" max="50" step="1" value="0">
<label>
<input id="showDock" type="checkbox" checked>ドックの別組立を表示</label>
<label>
<input id="showCovers" type="checkbox" checked>外装カバーを表示</label>
<label>
<input id="showRail" type="checkbox" checked>原本のレール・梁の取付参照</label>
</details>
<details>
<summary>色・表示</summary>
<label for="base">ベース色</label>
<input id="base" type="color" value="#24272c">
<label for="accent">アクセント色</label>
<input id="accent" type="color" value="#e32636">
<label>
<input id="grid" type="checkbox">グリッドを表示</label>
</details>
<details>
<summary>原本・使用版</summary>
<div class="foot" id="changerSources">
</div>
</details>
<a class="workbench-link" href="./toolheads.html">ホットエンド・押出機を組む</a>
<a class="workbench-link" href="./e3ng.html">E3NGのホットエンド交換機構</a>
</aside>
<section id="stage" aria-label="ツールチェンジャーの3Dアセンブリ">
<nav class="view-tools">
<button id="iso">斜め</button>
<button id="front">正面</button>
<button id="back">背面</button>
<button id="side">横</button>
<button id="fit">全体</button>
</nav>
<div id="loading" role="status">CADを読み込み中…</div>
<div class="view-meta">
<span id="changerDimensions">
</span>
<span class="hint">ドラッグ：回転　ホイール：拡大</span>
</div>
</section>
</main>
<script type="module" data-controller="./toolchangers.js?v=extra-machines-55" src="./workspace-router.mjs?v=91b9486cb838d6db916e">
</script>
</body>
</html>
