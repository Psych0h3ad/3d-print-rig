<!doctype html>
<html lang="ja">
<head>
<script src="./display-start.js?v=workspace-belts-2">
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FYSETC · 3D Print Rig</title>
<link rel="stylesheet" href="./viewer.css?v=workspace-belts-1">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"},"scopes":{"./vendor-r180/":{"three":"./vendor-r180/three.module.js"}}}</script>
<link rel="stylesheet" href="./workspace.css?v=8556101583ef781e96c1">
</head>
<body>
<header>
<div class="brand">
<span class="brand-mark">PR</span>
<div>
<strong>3D Print Rig</strong>
<small>COMMUNITY CAD</small>
</div>
</div>
<div class="header-actions">
<a class="mode-link" href="./toolheads.html">ツールヘッド</a>
<button id="openSources">出典・ライセンス</button>
<button id="openRender" class="primary" disabled>画像を書き出す</button>
<button id="openDownloads" hidden>
</button>
</div>
</header>
<main class="workspace">
<aside>
<label for="machineConfig">マシン</label>
<select id="machineConfig">
</select>
<h1>V2.4 R2 Pro / 250</h1>
<p class="foot">FYSETC公式組立CAD · 原本の基準姿勢</p>
<p class="foot notice">取得したCADの部品配置を表示します。可動機構・Mod交換と、現行キットの部品一致は未検証です。</p>
<a class="workbench-link" href="./toolheads.html">ツールヘッドの組み合わせ</a>
<details open>
<summary>色と素材</summary>
<div class="palette-row">
<label for="base">ベース</label>
<input id="base" type="color" value="#24272c">
</div>
<div class="palette-row">
<label for="accent">アクセント</label>
<input id="accent" type="color" value="#e32636">
</div>
<label for="frame">アルマイト</label>
<select id="frame">
<option value="#0e0f11">ブラック</option>
<option value="#b9bec4">シルバー</option>
</select>
<button id="resetPalette">標準CAD色</button>
</details>
<details open>
<summary>表示</summary>
<label>
<input id="gridVisible" type="checkbox">床グリッド</label>
<label>
<input id="enclosure" type="checkbox" checked>パネル</label>
</details>
<p class="foot" id="parts">
</p>
</aside>
<section id="stage" aria-label="FYSETC 3Dアセンブリ">
<nav class="view-tools">
<button id="iso">斜め</button>
<button id="front">正面</button>
<button id="top">上面</button>
</nav>
<div id="status" class="overlay">モデルを読み込み中…</div>
<div class="view-meta">
<span>FYSETC / 250</span>
<span class="hint">ドラッグ：回転　ホイール：拡大</span>
</div>
</section>
</main>
<script type="module" data-controller="./kit-reference.js?v=542ede0ff250a48e3ca8" src="./workspace-router.mjs?v=91b9486cb838d6db916e">
</script>
</body>
</html>
