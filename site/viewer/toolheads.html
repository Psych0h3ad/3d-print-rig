<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toolheads · 3D Print Rig</title><link rel="stylesheet" href="./viewer.css?v=mounts-v5"><link rel="stylesheet" href="./toolheads.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head>
<body class="toolhead-viewer"><header><div class="brand"><span class="brand-mark">PR</span><div><strong>3D Print Rig</strong><small>TOOLHEAD WORKBENCH</small></div></div><div class="header-actions"><a class="mode-link" id="printerLink" href="./">プリンター全体</a><button id="openSources">出典・ライセンス</button><button id="openRender" class="primary" disabled>画像を書き出す</button><button id="openDownloads" hidden></button></div></header>
<main class="workspace"><aside><span class="eyebrow">TOOLHEAD WORKBENCH</span><h1>ヘッドを組み合わせる</h1><p class="foot" id="combinationCount">構成を準備中…</p>
<a class="workbench-link" href="./components.html">部品単体のCADを確認 ↗</a><label for="toolheadConfig">ツールヘッド</label><select id="toolheadConfig" disabled></select>
<label for="extruderConfig">押出機</label><select id="extruderConfig" disabled></select>
<label for="hotendConfig">ホットエンド</label><select id="hotendConfig" disabled></select>
<label for="gantryConfig">キャリッジ / ベルト幅</label><select id="gantryConfig" disabled></select>
<p class="status" id="configStatus" aria-live="polite">CADを読み込み中…</p><p id="configSummary" hidden></p>
<details open><summary>配色</summary><label for="headPreset">配色セット</label><select id="headPreset"><option value="black_red">ブラック × レッド</option><option value="white_teal">ホワイト × ティール</option><option value="ivory_orange">アイボリー × オレンジ</option><option value="purple">チャコール × パープル</option><option value="custom" disabled>カスタム</option></select>
<div class="color-row"><label for="baseColor">印刷部品 / ベース</label><input id="baseColor" type="color" value="#24272c"><input id="baseHex" type="text" aria-label="ベース色 HEX" value="#24272c" maxlength="7"></div>
<div class="color-row"><label for="accentColor">アクセント</label><input id="accentColor" type="color" value="#e32636"><input id="accentHex" type="text" aria-label="アクセント色 HEX" value="#e32636" maxlength="7"></div>
<label><input id="seeInside" type="checkbox">外装を透かして内部を見る</label><p class="foot" id="headPaletteStatus"></p></details>
<details><summary>マウント・構成</summary><ul class="foot" id="mountInfo"></ul><ul class="foot" id="configRequirements"></ul><div class="buttons"><button id="saveConfiguration">構成を保存</button><button id="loadConfiguration">構成を読み込む</button></div><input id="configurationFile" type="file" accept=".json,application/json" hidden><p class="foot" id="modSources"></p></details>
</aside><section id="stage" aria-label="ツールヘッドの3Dアセンブリ"><nav class="view-tools" aria-label="視点"><button id="iso">斜め</button><button id="front">正面</button><button id="back">背面</button><button id="side">側面</button><button id="fit">全体を表示</button></nav><div id="loading" role="status">ヘッドのCADを読み込み中…</div><div class="view-meta"><span id="headDimensions"></span><span class="hint">ドラッグ：回転　ホイール：拡大</span></div></section></main>
<script type="module" src="./toolheads.js?v=mounts-v5"></script></body></html>
