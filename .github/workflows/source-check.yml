name: Check viewer source
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      NODE_OPTIONS: --max-old-space-size=512
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/prepare_repository_inputs.py
      - run: python3 -m pip install numpy==2.4.4
      - run: python3 scripts/check_repository.py --regression-workers 2
